name: Ritmo signed release

# Ручной процесс: сначала собирается и проверяется APK, публикация Release —
# только отдельным запуском с publish_release=true и точным тегом v<versionName>.
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Создать GitHub Release после проверки (только из main)"
        type: boolean
        default: false
      release_tag:
        description: "Тег релиза v<versionName> из version.properties (нужен при publish_release=true)"
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Собрать и проверить подписанный APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Проверить подпись и входные данные
        shell: bash
        env:
          PUBLISH_RELEASE: ${{ github.event.inputs.publish_release }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          KEYSTORE_BASE64: ${{ secrets.RITMO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RITMO_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RITMO_KEY_PASSWORD }}
          KEY_ALIAS: ${{ vars.RITMO_KEY_ALIAS }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "$(printenv "$name" || true)" ]; then
              echo "::error::Не задано обязательное значение $name (Secrets или Variables репозитория)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          if [ "$PUBLISH_RELEASE" = "true" ] && [ -z "$RELEASE_TAG" ]; then
            echo "::error::publish_release=true требует release_tag"
            exit 1
          fi

      - name: Определить версию из version.properties
        id: version
        shell: bash
        run: |
          set -euo pipefail
          date=$(sed -n 's/^versionDate=//p' version.properties | tr -d '\r' | head -n1)
          number=$(sed -n 's/^versionNumber=//p' version.properties | tr -d '\r' | head -n1)
          [[ "$date" =~ ^[0-9]{6}$ ]] || { echo "::error::Некорректный versionDate"; exit 1; }
          [[ "$number" =~ ^[0-9]+$ ]] || { echo "::error::Некорректный versionNumber"; exit 1; }
          number=$((10#$number))
          day="${date:0:4}.${date:4:2}"
          if [ "$number" -le 1 ]; then
            version="$day"
          else
            version="$day.$number"
          fi
          code=$((10#$date * 100 + 10#$number))
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Версия: $version ($code)"

      - name: Сверить тег с версией
        if: github.event.inputs.publish_release == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          expected="v${{ steps.version.outputs.name }}"
          if [ "$RELEASE_TAG" != "$expected" ]; then
            echo "::error::Тег '$RELEASE_TAG' не совпадает с версией; ожидается '$expected'"
            exit 1
          fi

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Проверить Android SDK
        shell: bash
        run: |
          set -euo pipefail
          # ubuntu-latest обычно содержит SDK 35. Если образ изменится, установите явно:
          # yes | sdkmanager --licenses
          # sdkmanager "platforms;android-35" "build-tools;35.0.0"
          test -n "${ANDROID_HOME:-}" || { echo "::error::ANDROID_HOME не задан"; exit 1; }
          for tool in apksigner aapt2; do
            test -x "$ANDROID_HOME/build-tools/35.0.0/$tool" || {
              echo "::error::В Android SDK нет build-tools/35.0.0/$tool"
              exit 1
            }
          done

      - name: Подготовить ключ из Secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RITMO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          signing_dir="$RUNNER_TEMP/ritmo-signing"
          mkdir -p "$signing_dir"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_dir/ritmo-release.jks"
          test -s "$signing_dir/ritmo-release.jks"

      - name: Собрать release APK
        shell: bash
        env:
          RITMO_KEYSTORE_FILE: ${{ runner.temp }}/ritmo-signing/ritmo-release.jks
          RITMO_KEYSTORE_PASSWORD: ${{ secrets.RITMO_KEYSTORE_PASSWORD }}
          RITMO_KEY_ALIAS: ${{ vars.RITMO_KEY_ALIAS }}
          RITMO_KEY_PASSWORD: ${{ secrets.RITMO_KEY_PASSWORD }}
          RITMO_REQUIRE_RELEASE_SIGNING: "true"
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Проверить подпись, версию и размер APK
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          # Публичный SHA-256 сертификата постоянного ключа Ritmo. Ключ не меняется,
          # поэтому ожидаемое значение закреплено здесь, а не задаётся переменной.
          EXPECTED_CERT_SHA256: "913ccbab919ca5bb13a889f50b5d02567febb72806f237c40ce80cbec8bcfad9"
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          case "$apk" in
            *debug*) echo "::error::Debug APK не может быть опубликован"; exit 1 ;;
          esac

          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          signers=$("$build_tools/apksigner" verify --verbose --print-certs "$apk" \
            | sed -n 's/^Number of signers: //p')
          cert=$("$build_tools/apksigner" verify --verbose --print-certs "$apk" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | tr -d '\r' | tr 'A-F' 'a-f')
          expected=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ' \r\n' | tr 'A-F' 'a-f')
          [ "$signers" = "1" ] || { echo "::error::Ожидается ровно одна подпись, получено: $signers"; exit 1; }
          [ -n "$cert" ] || { echo "::error::Не удалось прочитать SHA-256 сертификата"; exit 1; }
          [ "$cert" = "$expected" ] || {
            echo "::error::APK подписан не постоянным ключом (cert SHA-256: $cert)"
            exit 1
          }

          badging=$("$build_tools/aapt2" dump badging "$apk")
          echo "$badging" | grep -Fq "package: name='com.tmksdm.ritmo' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" \
            || { echo "::error::Package/versionCode/versionName не совпадают с version.properties"; exit 1; }
          echo "$badging" | grep -Fq "minSdkVersion:'26'" \
            || { echo "::error::Неожиданный minSdkVersion"; exit 1; }
          echo "$badging" | grep -Fq "targetSdkVersion:'35'" \
            || { echo "::error::Неожиданный targetSdkVersion"; exit 1; }

          size=$(stat -c%s "$apk")
          max=$((5 * 1024 * 1024))
          if [ "$size" -le 0 ] || [ "$size" -gt "$max" ]; then
            echo "::error::Размер APK $size байт не входит в предел $max байт (5 МиБ)"
            exit 1
          fi

          mkdir -p dist
          asset="dist/ritmo-$VERSION_NAME.apk"
          cp "$apk" "$asset"
          (cd dist && sha256sum "ritmo-$VERSION_NAME.apk" > "ritmo-$VERSION_NAME.apk.sha256")
          echo "APK: $asset, $size байт, cert SHA-256: $cert"

      - name: Загрузить artifact
        uses: actions/upload-artifact@v4
        with:
          name: ritmo-${{ steps.version.outputs.name }}-signed
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Опубликовать GitHub Release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: ritmo-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Скачать проверенный artifact
        uses: actions/download-artifact@v4
        with:
          name: ritmo-${{ needs.build.outputs.version }}-signed
          path: dist

      - name: Создать Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          VERSION_NAME: ${{ needs.build.outputs.version }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          expected="v$VERSION_NAME"
          if [ "$RELEASE_TAG" != "$expected" ]; then
            echo "::error::Тег '$RELEASE_TAG' не совпадает с версией; ожидается '$expected'"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Релиз $RELEASE_TAG уже существует"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Тег $RELEASE_TAG уже существует"
            exit 1
          fi
          apk="dist/ritmo-$VERSION_NAME.apk"
          test -f "$apk"
          (cd dist && sha256sum -c "ritmo-$VERSION_NAME.apk.sha256")
          gh release create "$RELEASE_TAG" \
            "$apk" \
            "$apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT_SHA" \
            --title "Ritmo $VERSION_NAME" \
            --notes "Подписанный release APK Ritmo $VERSION_NAME (versionCode $VERSION_CODE). Собран из коммита $COMMIT_SHA."
